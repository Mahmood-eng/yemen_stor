name: yemen_stor
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  go_router: ^10.1.1
  lottie: ^2.3.0
  flutter_riverpod: ^2.4.9
  flutter_bloc: ^8.1.0
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: any
  cloud_firestore: any
  firebase_auth: any
  shared_preferences: ^2.1.1
  local_auth: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^6.0.0


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/back.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/backing.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700